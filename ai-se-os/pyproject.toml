[build-system]
requires = [
    "setuptools>=77",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "ai-se-os"
version = "12.0.0"
description = "AI Software Engineering Operating System - Engineering Intelligence Platform"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "AI-SE OS Team", email = "team@ai-se-os.com"}
]
keywords = [
    "ai",
    "software-engineering",
    "agents",
    "engineering-intelligence",
    "operating-system"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Application Frameworks"
]

dependencies = [
    "pydantic>=2.0.0",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "opentelemetry-api>=1.20.0",
    "prometheus-client>=0.19.0",
    "openai>=1.0.0",
    "anthropic>=0.7.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "neo4j>=5.14.0",
    "asyncpg>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.3.0",
    "pytest-benchmark>=4.0.0",
    "pytest-html>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "types-redis>=4.0.0",
    "types-requests>=2.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
]

[project.urls]
Homepage = "https://github.com/ai-se-os/ai-os"
Repository = "https://github.com/ai-se-os/ai-os"
Documentation = "https://github.com/ai-se-os/ai-os/docs"
Issues = "https://github.com/ai-se-os/ai-os/issues"

# ============================================================
# Tool Configuration - Single Source of Truth
# ============================================================

[tool.setuptools]
package-dir = {"" = "src"}
packages = {find = {where = ["src"]}}

# ============================================================
# Ruff Configuration
# ============================================================
[tool.ruff]
target-version = "py310"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "RUF", # Ruff-specific
]
ignore = [
    "E501",  # Line too long
    "B008",  # Do not perform function calls in argument defaults
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ============================================================
# MyPy Configuration
# ============================================================
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "silent"
warn_no_return = false
check_untyped_defs = false
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = false

# ============================================================
# Pytest Configuration
# ============================================================
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q -v"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "performance: Performance tests",
    "chaos: Chaos tests",
    "benchmark: Benchmark tests",
]

# ============================================================
# Coverage Configuration
# ============================================================
[tool.coverage.run]
source = ["src/ai_se_os"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if False:",
]
fail_under = 25
show_missing = true

# ============================================================
# UV Package Manager
# ============================================================
[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.3.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]
