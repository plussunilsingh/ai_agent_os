[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-se-os"
version = "12.0.0"
description = "Engineering Intelligence Platform"
readme = "README.md"
authors = [{name = "AI-SE OS Team", email = "team@ai-se-os.com"}]
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0.0",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "opentelemetry-api>=1.20.0",
    "prometheus-client>=0.19.0",
    "openai>=1.0.0",
    "anthropic>=0.7.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "neo4j>=5.14.0",
    "asyncpg>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.3.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "types-redis>=4.0.0",
    "types-requests>=2.0.0",
]

[project.scripts]
ai-se-os = "ai_se_os.main:cli"

[tool.ruff]
target-version = "py310"
line-length = 100
select = ["E", "W", "F", "I", "C", "B", "UP", "RUF"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "silent"
warn_no_return = false
check_untyped_defs = false

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q -v"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.coverage.run]
source = ["src/ai_se_os"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
fail_under = 25
